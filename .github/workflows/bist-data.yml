name: BIST Tüm - Günlük Veri Motoru

on:
  workflow_dispatch:
  schedule:
    - cron: "45 16 * * 1-5"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: BIST Tüm evrenini hazırla
        env:
          BIST_SHARD_COUNT: "4"
        run: python scripts/prepare_universe.py

      - name: Evren dosyalarını yükle
        uses: actions/upload-artifact@v4
        with:
          name: bist-universe
          path: |
            bist_all_master.json
            symbols_tr.json
            shard_manifest.json
          retention-days: 1

  scan:
    needs: prepare
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Evren dosyalarını indir
        uses: actions/download-artifact@v4
        with:
          name: bist-universe
          path: .

      - name: BIST parçasını tara
        run: >
          python scripts/generate_shard.py
          --index ${{ matrix.shard }}
          --total 4
          --output shards/shard-${{ matrix.shard }}.json

      - name: Tarama parçasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: shards/shard-${{ matrix.shard }}.json
          retention-days: 1

  merge:
    needs: scan
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Evren dosyalarını indir
        uses: actions/download-artifact@v4
        with:
          name: bist-universe
          path: .

      - name: Tarama parçalarını indir
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards
          merge-multiple: true

      - name: Sonuçları birleştir
        run: python scripts/merge_snapshot.py --input shards

      - name: JSON verilerini depoya kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/*.json bist_all_master.json symbols_tr.json

          if git diff --cached --quiet; then
            echo "Kaydedilecek veri değişikliği yok."
          else
            git commit -m "BIST Tüm günlük verilerini güncelle"
            git push
          fi
